<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cars 13 — V13</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="rotateMessage">
        <div class="rotateIcon">↻</div>
        <h2>Rotate Your Phone</h2>
        <p>Cars 13 works best in landscape mode.</p>
    </div>

    <div id="game">
        <div id="hud">
            <div class="speed">
                <span id="speed">0</span>
                <small>KM/H</small>
            </div>
            <div class="gear">
                GEAR
                <span id="gear">1</span>
            </div>
            <div id="progress">
                <span id="modeLabel">CAREER</span>
                <span id="level">LEVEL 1</span>
                <span id="cash">$0</span>
            </div>
        </div>

        <button id="menuButton" type="button" aria-label="Open garage">GARAGE</button>
        <div id="interactionPrompt" aria-live="polite"></div>
        <div id="mapPanel" aria-label="World map">
            <div class="mapTitle">CITY MAP</div>
            <canvas id="miniMap" width="220" height="150"></canvas>
            <div class="mapLegend">
                <span><i class="mapDot playerDot"></i> YOU</span>
                <span><i class="mapDot checkpointDot"></i> GOAL</span>
            </div>
        </div>

        <div id="controls">
            <div class="steeringControls">
                <button id="left" type="button" aria-label="Steer left">◀</button>
                <button id="right" type="button" aria-label="Steer right">▶</button>
            </div>
            <div class="actionControl">
                <button id="action" type="button" aria-label="Exit vehicle">EXIT</button>
            </div>
            <div class="pedalControls">
                <button id="brake" type="button" aria-label="Brake">BRAKE</button>
                <button id="gas" type="button" aria-label="Accelerate">GAS</button>
            </div>
        </div>

        <section id="garagePanel" class="is-open" aria-label="Garage">
            <div class="garageCard">
                <p class="eyebrow">CARS 13</p>
                <h1>V13: Drive Your Way</h1>
                <p class="garageIntro">Build your collection, race through career levels, or explore the world on foot and behind the wheel.</p>
                <div class="modePicker">
                    <button id="careerMode" class="is-selected" type="button">CAREER</button>
                    <button id="freeMode" type="button">FREE DRIVE</button>
                </div>
                <div id="carList" aria-label="Available cars"></div>
                <p id="garageHint" class="garageHint"></p>
                <button id="startDrive" class="primaryButton" type="button">START CAREER</button>
                <p class="controlsHint">Drive: WASD / Arrow keys · Exit or enter: E</p>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="game-v11.js"></script>

    <script>
        function checkOrientation() {
            const message = document.getElementById("rotateMessage");
            message.style.display = window.innerHeight > window.innerWidth ? "flex" : "none";
        }
        checkOrientation();
        window.addEventListener("resize", checkOrientation);
        window.addEventListener("orientationchange", checkOrientation);
    </script>

<style>
#mobileJoystick {
    position: fixed; left: 24px; bottom: 28px; width: 130px; height: 130px;
    border-radius: 50%; background: rgba(20,25,35,.55);
    border: 3px solid rgba(255,255,255,.55);
    box-shadow: 0 6px 20px rgba(0,0,0,.35), inset 0 0 20px rgba(255,255,255,.08);
    display: none; touch-action: none; user-select: none; -webkit-user-select: none; z-index: 1000;
}
#mobileJoystick.is-visible { display:block; }
#mobileJoystick::before {
    content:""; position:absolute; left:50%; top:50%; width:70px; height:70px;
    transform:translate(-50%,-50%); border-radius:50%; background:rgba(255,255,255,.08); pointer-events:none;
}
#mobileJoystickKnob {
    position:absolute; left:50%; top:50%; width:58px; height:58px; transform:translate(-50%,-50%);
    border-radius:50%; background:rgba(255,255,255,.88); border:2px solid rgba(255,255,255,.95);
    box-shadow:0 4px 12px rgba(0,0,0,.35); pointer-events:none;
}
#mobileAction {
    position:fixed; right:28px; bottom:42px; width:105px; height:65px; border-radius:20px;
    border:2px solid rgba(255,255,255,.65); background:rgba(25,30,40,.75); color:white;
    font-size:17px; font-weight:800; letter-spacing:.5px; display:none; align-items:center; justify-content:center;
    touch-action:manipulation; user-select:none; z-index:1001;
}
#mobileAction.is-visible { display:flex; }
#mobileCamera {
    position:fixed; right:28px; bottom:120px; width:65px; height:65px; border-radius:50%;
    border:2px solid rgba(255,255,255,.65); background:rgba(25,30,40,.72); color:white; font-size:25px;
    display:none; align-items:center; justify-content:center; touch-action:manipulation; user-select:none; z-index:1001;
}
#mobileCamera.is-visible { display:flex; }
@media (max-width:600px) {
    #mobileJoystick { left:15px; bottom:18px; width:125px; height:125px; }
    #mobileAction { right:18px; bottom:30px; width:100px; height:62px; }
    #mobileCamera { right:18px; bottom:105px; width:60px; height:60px; }
}
@media (max-height:500px) {
    #mobileJoystick { bottom:12px; width:110px; height:110px; }
    #mobileAction { bottom:20px; height:55px; }
    #mobileCamera { bottom:88px; width:52px; height:52px; }
}
@media (pointer:coarse) {
    #mobileJoystick,#mobileAction,#mobileCamera { -webkit-tap-highlight-color:transparent; }
}
@media (pointer:fine) {
    #mobileJoystick,#mobileAction,#mobileCamera { display:none !important; }
}
</style>

<div id="mobileJoystick" aria-label="Walking joystick">
    <div id="mobileJoystickKnob"></div>
</div>
<button id="mobileAction" type="button" aria-label="Enter or exit vehicle">EXIT</button>
<button id="mobileCamera" type="button" aria-label="Change camera">◉</button>

<script>
console.log("========================================");
console.log(" CARS 13 V13 READY ");
console.log(" Road + car + walking stability patch: READY ");
console.log(" Mobile walking joystick: READY ");
console.log(" City + airport: READY ");
console.log("========================================");
</script>
</body>
</html>
