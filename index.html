<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <meta name="theme-color"
          content="#000000">

    <meta name="mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <title>Cars 13 — V9</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- =========================================
         ROTATE PHONE MESSAGE
    ========================================== -->

    <div id="rotateMessage">

        <div class="rotateIcon">↻</div>

        <h2>
            Rotate Your Phone
        </h2>

        <p>
            Cars 13 works best in landscape mode.
        </p>

    </div>


    <!-- =========================================
         GAME
    ========================================== -->

    <div id="game">


        <!-- =====================================
             HUD
        ====================================== -->

        <div id="hud">

            <div class="speed">

                <span id="speed">
                    0
                </span>

                <small>
                    KM/H
                </small>

            </div>


            <div class="gear">

                GEAR

                <span id="gear">
                    1
                </span>

            </div>

        </div>


        <!-- =====================================
             MOBILE CONTROLS
        ====================================== -->

        <div id="controls">


            <!-- STEERING -->

            <div class="steeringControls">

                <button
                    id="left"
                    type="button"
                    aria-label="Steer left">
                    ◀
                </button>

                <button
                    id="right"
                    type="button"
                    aria-label="Steer right">
                    ▶
                </button>

            </div>


            <!-- PEDALS -->

            <div class="pedalControls">

                <button
                    id="brake"
                    type="button"
                    aria-label="Brake">
                    BRAKE
                </button>

                <button
                    id="gas"
                    type="button"
                    aria-label="Accelerate">
                    GAS
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================
         THREE.JS
    ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
    </script>


    <!-- =========================================
         CARS 13 V8 GAME
    ========================================== -->

    <script src="game-v9.js"></script>


    <!-- =========================================
         ORIENTATION CHECK
    ========================================== -->

    <script>

        function checkOrientation() {

            const message =
                document.getElementById(
                    "rotateMessage"
                );

            if (
                window.innerHeight >
                window.innerWidth
            ) {

                message.style.display =
                    "flex";

            } else {

                message.style.display =
                    "none";

            }

        }


        checkOrientation();


        window.addEventListener(
            "resize",
            checkOrientation
        );


        window.addEventListener(
            "orientationchange",
            checkOrientation
        );

    </script>

</body>

</html>
