<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <meta name="theme-color"
          content="#000000">

    <meta name="mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <title>Cars 13 — V11</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- =========================================
         ROTATE PHONE MESSAGE
    ========================================== -->

    <div id="rotateMessage">

        <div class="rotateIcon">↻</div>

        <h2>
            Rotate Your Phone
        </h2>

        <p>
            Cars 13 works best in landscape mode.
        </p>

    </div>


    <!-- =========================================
         GAME
    ========================================== -->

    <div id="game">


        <!-- =====================================
             HUD
        ====================================== -->

        <div id="hud">

            <div class="speed">

                <span id="speed">
                    0
                </span>

                <small>
                    KM/H
                </small>

            </div>


            <div class="gear">

                GEAR

                <span id="gear">
                    1
                </span>

            </div>

            <div id="progress">
                <span id="modeLabel">CAREER</span>
                <span id="level">LEVEL 1</span>
                <span id="cash">$0</span>
            </div>

        </div>

        <button
            id="menuButton"
            type="button"
            aria-label="Open garage">
            GARAGE
        </button>

        <div
            id="interactionPrompt"
            aria-live="polite">
        </div>

        <div id="mapPanel" aria-label="World map">
            <div class="mapTitle">CITY MAP</div>
            <canvas id="miniMap" width="220" height="150"></canvas>
            <div class="mapLegend">
                <span><i class="mapDot playerDot"></i> YOU</span>
                <span><i class="mapDot checkpointDot"></i> GOAL</span>
            </div>
        </div>


        <!-- =====================================
             MOBILE CONTROLS
        ====================================== -->

        <div id="controls">


            <!-- STEERING -->

            <div class="steeringControls">

                <button
                    id="left"
                    type="button"
                    aria-label="Steer left">
                    ◀
                </button>

                <button
                    id="right"
                    type="button"
                    aria-label="Steer right">
                    ▶
                </button>

            </div>

            <div class="actionControl">

                <button
                    id="action"
                    type="button"
                    aria-label="Exit vehicle">
                    EXIT
                </button>

            </div>


            <!-- PEDALS -->

            <div class="pedalControls">

                <button
                    id="brake"
                    type="button"
                    aria-label="Brake">
                    BRAKE
                </button>

                <button
                    id="gas"
                    type="button"
                    aria-label="Accelerate">
                    GAS
                </button>

            </div>

        </div>

        <section
            id="garagePanel"
            class="is-open"
            aria-label="Garage">

            <div class="garageCard">

                <p class="eyebrow">CARS 13</p>
                <h1>V11: Drive Your Way</h1>
                <p class="garageIntro">
                    Build your collection, race through career levels, or
                    explore the world on foot and behind the wheel.
                </p>

                <div class="modePicker">

                    <button
                        id="careerMode"
                        class="is-selected"
                        type="button">
                        CAREER
                    </button>

                    <button
                        id="freeMode"
                        type="button">
                        FREE DRIVE
                    </button>

                </div>

                <div
                    id="carList"
                    aria-label="Available cars">
                </div>

                <p
                    id="garageHint"
                    class="garageHint">
                </p>

                <button
                    id="startDrive"
                    class="primaryButton"
                    type="button">
                    START CAREER
                </button>

                <p class="controlsHint">
                    Drive: WASD / Arrow keys · Exit or enter: E
                </p>

            </div>

        </section>

    </div>


    <!-- =========================================
         THREE.JS
    ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">
    </script>


    <!-- =========================================
         CARS 13 V11 GAME
    ========================================== -->

    <script src="game-v12.js"></script>

    <!-- =========================================
         ORIENTATION CHECK
    ========================================== -->

    <script>

        function checkOrientation() {

            const message =
                document.getElementById(
                    "rotateMessage"
                );

            if (
                window.innerHeight >
                window.innerWidth
            ) {

                message.style.display =
                    "flex";

            } else {

                message.style.display =
                    "none";

            }

        }


        checkOrientation();


        window.addEventListener(
            "resize",
            checkOrientation
        );


        window.addEventListener(
            "orientationchange",
            checkOrientation
        );

    </script>

</body>

</html>
